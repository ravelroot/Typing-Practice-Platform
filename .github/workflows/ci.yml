name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes de unidade
        run: npm test
      - name: Pluma.html em dia com o código
        run: npm run check
      - name: Navegador para os testes ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta
        run: npm run test:e2e

  java:
    name: Ferramentas (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Conferir o acervo
        run: java tools/Acervo.java web/data/textos.json web/data/palavras.json
      - name: Compilar com avisos como erro
        run: javac -Xlint:all -Werror -d "$RUNNER_TEMP/classes" tools/Acervo.java tools/Servidor.java
